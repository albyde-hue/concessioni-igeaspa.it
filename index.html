<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >
  <title>CONCESSIONI IGEA S.p.A.</title>

  <style>
    :root {
      --header-height: 75px;
      --header-color: #2c3e50;
      --id-color: #f39c12;
      --unlock-button-color: #27ae60;
      --unlock-button-hover-color: #1e8449;
      --lock-button-color: #e74c3c;
      --lock-button-hover-color: #c0392b;
      --close-button-color: #e74c3c;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ffffff;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    #mappa {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .custom-header {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      width: 100%;
      height: var(--header-height);
      padding: 0 15px;
      color: #ffffff;
      background: var(--header-color);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
    }

    .header-info {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      min-width: 0;
      max-width: 55vw;
      line-height: 1.2;
    }

    .info-id,
    .info-concessione {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .info-id {
      color: var(--id-color);
      font-size: 22px;
      font-weight: 700;
    }

    .info-concessione {
      margin-top: 3px;
      color: #ffffff;
      opacity: 0.92;
      font-size: 14px;
      font-style: italic;
    }

    .header-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 10px;
    }

    .header-btn {
      border: 0;
      border-radius: 4px;
      color: #ffffff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      transition: background-color 0.2s, transform 0.15s;
      white-space: nowrap;
    }

    .navigation-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 124px;
      padding: 8px 12px;
      background: var(--unlock-button-color);
      line-height: 1.1;
      text-align: center;
    }

    .navigation-btn.is-unlocked {
      background: var(--lock-button-color);
    }

    .navigation-btn:hover {
      background: var(--unlock-button-hover-color);
    }

    .navigation-btn.is-unlocked:hover {
      background: var(--lock-button-hover-color);
    }

    .navigation-btn span {
      display: block;
      width: 100%;
      text-align: center;
    }

    .navigation-btn .nav-subtitle {
      margin-top: 2px;
      font-size: 10px;
      letter-spacing: 0.2px;
    }

    .close-btn {
      padding: 9px 15px;
      background: var(--close-button-color);
    }

    .close-btn:hover {
      background: #c0392b;
    }

    .header-btn:active {
      transform: translateY(1px);
    }

    .center-pin {
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 50;
      width: 40px;
      height: 40px;
      pointer-events: none;
      transform: translate(-50%, -100%);
      filter: drop-shadow(0 4px 3px rgba(0, 0, 0, 0.35));
    }

    .center-pin.hidden {
      display: none;
    }

    .glass-pane {
      position: fixed;
      top: var(--header-height);
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 60;
      background: transparent;
      pointer-events: auto;
    }

    .glass-pane.unlocked {
      display: none;
    }

    @media (max-width: 768px) {
      :root {
        --header-height: 62px;
      }

      .custom-header {
        align-items: center;
        padding: 0 10px;
      }

      .header-info {
        flex: 1 1 auto;
        min-width: 0;
        max-width: none;
        padding-right: 8px;
      }

      .info-id {
        font-size: 18px;
      }

      .info-concessione {
        overflow: hidden;
        margin-top: 2px;
        font-size: 11px;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .header-actions {
        flex: 0 0 auto;
        gap: 0;
        margin-left: 4px;
      }

      .navigation-btn {
        flex: 0 0 78px;
        min-width: 78px;
        min-height: 43px;
        padding: 6px 5px;
        font-size: 10px;
        line-height: 1.08;
        white-space: normal;
      }

      .navigation-btn .nav-subtitle {
        margin-top: 2px;
        font-size: 9px;
        letter-spacing: 0;
      }

      .close-btn {
        display: none;
      }
    }
  </style>
</head>

<body>
  <iframe
    id="mappa"
    title="Mappa concessioni IGEA"
    loading="eager"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>

  <header class="custom-header">
    <div class="header-info">
      <span id="displayId" class="info-id">ID: N/D</span>
      <span id="displayConcessione" class="info-concessione"></span>
    </div>

    <div class="header-actions">
      <button
        id="navigationButton"
        class="header-btn navigation-btn"
        type="button"
        aria-label="Sblocca navigazione"
      >
        <span id="navigationAction">SBLOCCA</span>
        <span class="nav-subtitle">NAVIGAZIONE</span>
      </button>

      <button
        id="closeButton"
        class="header-btn close-btn"
        type="button"
      >
        CHIUDI
      </button>
    </div>
  </header>

  <div id="pinSelezionato" class="center-pin" aria-hidden="true">
    <svg
      viewBox="0 0 24 24"
      fill="#DB4437"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"
      />
    </svg>
  </div>

  <div
    id="glassPane"
    class="glass-pane"
    aria-label="Navigazione mappa bloccata"
  ></div>

  <script>
    const MY_MAPS_ID = "1bxno4JIrzoUtn1eHwdDXpsJCEUHvHi8";

    const params = new URLSearchParams(window.location.search);

    function parametro(nome, predefinito = "") {
      const valore = params.get(nome);
      return valore !== null && valore !== "" ? valore : predefinito;
    }

    let lat = parametro("lat");
    let lng = parametro("lng");

    if (!lat || !lng) {
      const ll = parametro("ll");

      if (ll.includes(",")) {
        const coordinate = ll.split(",");
        lat = coordinate[0].trim();
        lng = coordinate[1].trim();
      }
    }

    lat = lat || "39.511889";
    lng = lng || "8.547901";

    const id = parametro("id", "N/D");
    const concessione = parametro("concessione", "");
    const zoom = parametro("zoom", parametro("z", "18"));

    const iframe = document.getElementById("mappa");
    const pin = document.getElementById("pinSelezionato");
    const glassPane = document.getElementById("glassPane");
    const navigationButton = document.getElementById("navigationButton");
    const navigationAction = document.getElementById("navigationAction");
    const displayId = document.getElementById("displayId");
    const displayConcessione = document.getElementById("displayConcessione");

    let navigazioneSbloccata = false;

    displayId.textContent = "ID: " + id;

    if (concessione.trim() !== "") {
      displayConcessione.textContent = "Concessione: " + concessione;
    } else {
      displayConcessione.style.display = "none";
    }

    function creaUrlMappa() {
      return (
        "https://www.google.com/maps/d/u/0/embed?mid=" +
        encodeURIComponent(MY_MAPS_ID) +
        "&ll=" +
        encodeURIComponent(lat + "," + lng) +
        "&z=" +
        encodeURIComponent(zoom)
      );
    }

    function tornaAllaPosizioneIniziale() {
      iframe.src = creaUrlMappa();
    }

    tornaAllaPosizioneIniziale();

    function aggiornaStatoNavigazione() {
      if (navigazioneSbloccata) {
        glassPane.classList.add("unlocked");
        pin.classList.add("hidden");
        navigationButton.classList.add("is-unlocked");
        navigationAction.textContent = "BLOCCA";
        navigationButton.setAttribute("aria-label", "Blocca navigazione");

        glassPane.setAttribute(
          "aria-label",
          "Navigazione mappa sbloccata"
        );
      } else {
        tornaAllaPosizioneIniziale();

        glassPane.classList.remove("unlocked");
        pin.classList.remove("hidden");
        navigationButton.classList.remove("is-unlocked");
        navigationAction.textContent = "SBLOCCA";
        navigationButton.setAttribute("aria-label", "Sblocca navigazione");

        glassPane.setAttribute(
          "aria-label",
          "Navigazione mappa bloccata"
        );
      }
    }

    navigationButton.addEventListener("click", function () {
      navigazioneSbloccata = !navigazioneSbloccata;
      aggiornaStatoNavigazione();
    });

    document.getElementById("closeButton").addEventListener("click", function () {
      window.close();

      setTimeout(function () {
        window.history.back();
      }, 150);
    });
  </script>
</body>
</html>

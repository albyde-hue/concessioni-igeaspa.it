<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >
  <title>CONCESSIONI IGEA S.p.A.</title>

  <style>
    :root {
      --header-height: 75px;
      --header-color: #2c3e50;
      --id-color: #f39c12;
      --pin-button-color: #34495e;
      --close-button-color: #e74c3c;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ffffff;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    #mappa {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .custom-header {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      width: 100%;
      height: var(--header-height);
      padding: 0 15px;
      color: #ffffff;
      background: var(--header-color);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
    }

    .header-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
      max-width: 55vw;
      line-height: 1.2;
    }

    .info-id,
    .info-concessione {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .info-id {
      color: var(--id-color);
      font-size: 22px;
      font-weight: 700;
    }

    .info-concessione {
      margin-top: 3px;
      color: #ffffff;
      opacity: 0.92;
      font-size: 14px;
      font-style: italic;
    }

    .header-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 10px;
    }

    .header-btn {
      padding: 9px 15px;
      border: 0;
      border-radius: 4px;
      color: #ffffff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .pin-btn {
      background: var(--pin-button-color);
    }

    .pin-btn:hover {
      background: #1f2c38;
    }

    .close-btn {
      background: var(--close-button-color);
    }

    .close-btn:hover {
      background: #c0392b;
    }

    .header-btn:active {
      transform: translateY(1px);
    }

    .center-pin {
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 50;
      width: 40px;
      height: 40px;
      transform: translate(-50%, -100%);
      pointer-events: none;
      filter: drop-shadow(0 4px 3px rgba(0, 0, 0, 0.35));
    }

    .center-pin.hidden {
      display: none;
    }

    @media (max-width: 768px) {
      :root {
        --header-height: 62px;
      }

      .custom-header {
        padding: 0 10px;
      }

      .header-info {
        max-width: 48vw;
      }

      .info-id {
        font-size: 18px;
      }

      .info-concessione {
        margin-top: 2px;
        font-size: 11px;
      }

      .header-actions {
        gap: 6px;
      }

      .header-btn {
        padding: 8px 9px;
        font-size: 11px;
      }

      .close-btn {
        display: none;
      }
    }
  </style>
</head>

<body>
  <iframe
    id="mappa"
    title="Mappa concessioni IGEA"
    loading="eager"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>

  <header class="custom-header">
    <div class="header-info">
      <span id="displayId" class="info-id">ID: N/D</span>
      <span id="displayConcessione" class="info-concessione"></span>
    </div>

    <div class="header-actions">
      <button id="pinButton" class="header-btn pin-btn" type="button">
        NASCONDI PIN
      </button>

      <button id="closeButton" class="header-btn close-btn" type="button">
        CHIUDI
      </button>
    </div>
  </header>

  <div id="pinSelezionato" class="center-pin" aria-hidden="true">
    <svg
      viewBox="0 0 24 24"
      fill="#DB4437"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"
      />
    </svg>
  </div>

  <script>
    const MY_MAPS_ID = "1bxno4JIrzoUtn1eHwdDXpsJCEUHvHi8";

    const params = new URLSearchParams(window.location.search);

    function parametro(nome, predefinito = "") {
      const valore = params.get(nome);
      return valore !== null && valore !== "" ? valore : predefinito;
    }

    let lat = parametro("lat");
    let lng = parametro("lng");

    if (!lat || !lng) {
      const ll = parametro("ll");

      if (ll.includes(",")) {
        const coordinate = ll.split(",");
        lat = coordinate[0].trim();
        lng = coordinate[1].trim();
      }
    }

    lat = lat || "39.511889";
    lng = lng || "8.547901";

    const id = parametro("id", "N/D");
    const concessione = parametro("concessione", "");
    const zoom = parametro("zoom", parametro("z", "18"));

    const iframe = document.getElementById("mappa");
    const pin = document.getElementById("pinSelezionato");
    const pinButton = document.getElementById("pinButton");
    const displayId = document.getElementById("displayId");
    const displayConcessione = document.getElementById("displayConcessione");

    displayId.textContent = "ID: " + id;

    if (concessione.trim() !== "") {
      displayConcessione.textContent = "Concessione: " + concessione;
    } else {
      displayConcessione.style.display = "none";
    }

    const urlMappa =
      "https://www.google.com/maps/d/u/0/embed?mid=" +
      encodeURIComponent(MY_MAPS_ID) +
      "&ll=" +
      encodeURIComponent(lat + "," + lng) +
      "&z=" +
      encodeURIComponent(zoom);

    iframe.src = urlMappa;

    pinButton.addEventListener("click", function () {
      const pinNascosto = pin.classList.toggle("hidden");

      pinButton.textContent = pinNascosto
        ? "MOSTRA PIN"
        : "NASCONDI PIN";
    });

    document.getElementById("closeButton").addEventListener("click", function () {
      window.close();

      setTimeout(function () {
        window.history.back();
      }, 150);
    });
  </script>
</body>
</html>
